{% extends "base.html" %}
{% block title %}Error{% endblock %}
{% block content %}
  <div class="card" style="text-align: center; max-width: 600px; margin: 0 auto;">
    <div class="error-icon" style="font-size: 5rem; color: var(--danger); margin-bottom: 1.5rem;">
      <i class="fas fa-exclamation-triangle"></i>
    </div>
    <h2 style="color: var(--danger); margin-bottom: 1.5rem;">
      Something Went Wrong
    </h2>
    <div class="error-card" style="background: rgba(239, 71, 111, 0.05); border-radius: 12px; padding: 1.5rem; margin-bottom: 2rem;">
      <p style="font-size: 1.2rem; color: var(--dark);">{{ message }}</p>
    </div>
    <div class="actions" style="justify-content: center;">
      <a href="{{ url_for('index') }}" class="action-btn secondary">
        <i class="fas fa-arrow-left"></i> Back to Home
      </a>
    </div>
  </div>
{% endblock %}
