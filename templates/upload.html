{% extends "base.html" %}
{% block title %}Upload Invoice{% endblock %}
{% block content %}
  <h2>Upload TunTrust/STB Invoice</h2>

  <div class="card" style="text-align: center;">
    <h3><i class="fas fa-cloud-upload-alt"></i> Upload Invoice</h3>

    <form class="upload-form" method="post" action="{{ url_for('upload') }}" enctype="multipart/form-data" style="margin-top: 2rem;">
      <div style="position: relative; width: 100%; max-width: 500px; margin: 0 auto;">
        <input type="file" name="file" id="fileInput" accept="image/*,.pdf" required
               style="position: absolute; width: 100%; height: 100%; top: 0; left: 0; opacity: 0; cursor: pointer; z-index: 2;">
        <div id="uploadArea"
             style="border: 3px dashed #e0e0e0; border-radius: 16px; padding: 2.5rem; transition: var(--transition);">
          <i class="fas fa-cloud-upload-alt" style="font-size: 3.5rem; color: var(--primary); margin-bottom: 1rem;"></i>
          <h4 style="font-size: 1.3rem; margin-bottom: 0.5rem; color: var(--dark);">Drag & Drop your file here</h4>
          <p style="color: var(--gray); margin-bottom: 1.5rem;">Supported formats: JPG, PNG, PDF (Max 10MB)</p>
          <div class="file-info" id="fileInfo" style="margin-top: 1rem; font-weight: 500; color: var(--primary);"></div>
          <div style="background: var(--primary); color: white; padding: 0.8rem 1.5rem; border-radius: 50px; display: inline-block; cursor: pointer;">
            <i class="fas fa-folder-open"></i> Select File
          </div>
        </div>
      </div>

      <button type="submit" class="action-btn primary" style="margin-top: 2rem; font-size: 1.1rem;">
        <i class="fas fa-paper-plane"></i> Process Invoice
      </button>
    </form>
  </div>

  <script>
    // File upload interactions
    const uploadArea = document.getElementById('uploadArea');
    const fileInput = document.getElementById('fileInput');
    const fileInfo = document.getElementById('fileInfo');

    uploadArea.addEventListener('dragover', (e) => {
      e.preventDefault();
      uploadArea.style.borderColor = 'var(--success)';
      uploadArea.style.backgroundColor = 'rgba(6, 214, 160, 0.05)';
    });

    uploadArea.addEventListener('dragleave', () => {
      uploadArea.style.borderColor = '#e0e0e0';
      uploadArea.style.backgroundColor = 'transparent';
    });

    uploadArea.addEventListener('drop', (e) => {
      e.preventDefault();
      uploadArea.style.borderColor = '#e0e0e0';
      uploadArea.style.backgroundColor = 'transparent';

      if (e.dataTransfer.files.length) {
        fileInput.files = e.dataTransfer.files;
        showFileInfo(e.dataTransfer.files[0]);
      }
    });

    fileInput.addEventListener('change', () => {
      if (fileInput.files.length) {
        showFileInfo(fileInput.files[0]);
      }
    });

    function showFileInfo(file) {
      fileInfo.textContent = `Selected: ${file.name} (${formatFileSize(file.size)})`;
      fileInfo.style.display = 'block';
    }

    function formatFileSize(bytes) {
      if (bytes === 0) return '0 Bytes';
      const k = 1024;
      const sizes = ['Bytes', 'KB', 'MB', 'GB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
    }
  </script>
{% endblock %}
