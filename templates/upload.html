{% extends "base.html" %}
{% block title %}Upload Invoice{% endblock %}
{% block content %}
  <h2>Upload TunTrust/STB Invoice</h2>
  <form class="upload-form" method="post" action="{{ url_for('upload') }}" enctype="multipart/form-data">
    <input type="file" name="file" accept="image/*,.pdf" required>
    <button type="submit">Upload & OCR</button>
  </form>
{% endblock %}
